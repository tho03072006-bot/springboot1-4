spring.application.name=springboot1-4
server.port=${PORT:8081}
server.address=127.0.0.1
server.servlet.context-path=/springboot1-4
spring.datasource.url=jdbc:h2:file:./data/springboot-admin;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.h2.console.enabled=false
app.bootstrap.username=${ADMIN_USERNAME:admin}
app.bootstrap.password=${ADMIN_PASSWORD:Admin@12345}
